name: Custom Feather Build

on:
  push:
    branches:
      - ux/imported-signed-tabs
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.0.app
          xcodebuild -version

      - name: Prepare dependencies
        run: make deps

      - name: Build iOS IPA
        run: |
          set -o pipefail
          rm -rf _build
          xcodebuild \
            -workspace Feather.xcworkspace \
            -scheme Feather \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/Feather/iphoneos" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO

          mkdir -p _build/Payload
          cp -R _build/Applications/*.app _build/Payload/Feather.app
          chmod -R 0755 _build/Payload/Feather.app
          codesign --force --sign - --timestamp=none _build/Payload/Feather.app
          cp deps/* _build/Payload/Feather.app/ || true

          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent _build/Payload packages/Feather.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Custom-IPA
          path: packages/Feather.ipa
          if-no-files-found: error
