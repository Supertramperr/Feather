name: Custom Feather Build

on:
  push:
    branches:
      - ux/imported-signed-tabs
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: 'true'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Build iOS IPA
        run: |
          set -o pipefail
          echo "Building Feather for iOS..."
          make iphoneos

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Custom-IPA
          path: packages/Feather.ipa
          if-no-files-found: error
